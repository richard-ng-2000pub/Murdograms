<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>Solution</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #solution {
      display: block;

      width: 100%;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;

      object-fit: contain;
      object-position: center center;

      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <img
    id="solution"
    alt="Puzzle solution"
  >

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("f");

    if (file) {
      document.getElementById("solution").src =
        "solutions/" + encodeURIComponent(file);
    }
  </script>

</body>
</html>
